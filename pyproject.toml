[project]
name = "proyecto-asma"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alejandroldz", email = "alejandroldz2004@gmail.com" },
    { name = "alvarofernandezsanchez", email = "alvaroarquero1@gmail.com" },
    { name = "AlvaroPRuiiz", email = "alvaro.poveda.ruiz@alumnos.upm.es" }
]
requires-python = ">=3.14"
dependencies = [
    "bs4>=0.0.2",
    "fastapi>=0.115.0",
    "matplotlib>=3.9.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "requests>=2.32.0",
    "scikit-learn>=1.5.0",
]

[project.scripts]
proyecto-asma = "proyecto_asma:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
